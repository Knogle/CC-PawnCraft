modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Knogle/CC-PawnCraft/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Knogle Industries"
displayURL="https://github.com/Knogle/CC-PawnCraft"
description='''
PawnCraft runs PAWN/AMX programs on CC:Tweaked computers through a server-side
API bridge, with native compilation and access to ComputerCraft APIs.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="computercraft"
type="required"
reason="PawnCraft extends CC:Tweaked computers"
versionRange="[1.120.2,)"
ordering="AFTER"
side="BOTH"
